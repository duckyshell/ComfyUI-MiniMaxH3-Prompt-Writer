description = "A multimodal MiniMax H3 prompt-writing extension for ComfyUI with local and API providers."
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = []
classifiers = [
    "Operating System :: Microsoft :: Windows",
]

[project.urls]
Repository = "https://github.com/duckyshell/ComfyUI-MiniMaxH3-Prompt-Writer"
