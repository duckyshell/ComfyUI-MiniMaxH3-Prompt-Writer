[project]
name = "MiniMaxH3-Prompt-Writer"
version = "0.2.0"
description = "A local multimodal MiniMax H3 prompt writer for ComfyUI, powered by Gemma 4 GGUF models."
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = []
classifiers = [
    "Operating System :: Microsoft :: Windows",
    "Environment :: GPU :: NVIDIA CUDA",
]

[project.urls]
Repository = "https://github.com/duckyshell/ComfyUI-MiniMaxH3-Prompt-Writer"
Documentation = "https://github.com/duckyshell/ComfyUI-MiniMaxH3-Prompt-Writer#readme"
"Bug Tracker" = "https://github.com/duckyshell/ComfyUI-MiniMaxH3-Prompt-Writer/issues"

[tool.comfy]
PublisherId = "duckyshell"
DisplayName = "H3 Prompt Writer"
Icon = "https://raw.githubusercontent.com/duckyshell/ComfyUI-MiniMaxH3-Prompt-Writer/main/web/assets/h3-prompt-writer-launcher.svg"
