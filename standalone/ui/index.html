<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>H3 Prompt Writer</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
    body { margin: 0; min-height: 100vh; background: #101114; color: #e8e9eb; }
    .host-shell { min-height: 100vh; display: grid; place-content: center; text-align: center; gap: 8px; }
    .host-shell strong { font-size: 22px; }
    .host-shell span { color: #9297a1; font-size: 13px; }
    html[data-h3-standalone-shell="ready"] .host-shell { display: none; }
    .h3ps-root[data-standalone-shell="true"] > [data-close-studio],
    .h3ps-root[data-standalone-shell="true"] .h3ps-header [data-close-studio],
    .h3ps-root[data-standalone-shell="true"] [data-fullscreen-toggle] { display: none !important; }
    .h3ps-root[data-standalone-shell="true"] [data-comfy-memory-action] { pointer-events: none; opacity: .42; }
  </style>
</head>
<body>
  <main class="host-shell" aria-live="polite">
    <strong>H3 Prompt Writer</strong>
    <span data-host-status>Starting the local Writer…</span>
  </main>
  <script type="module" src="/scripts/boot.js"></script>
</body>
</html>
