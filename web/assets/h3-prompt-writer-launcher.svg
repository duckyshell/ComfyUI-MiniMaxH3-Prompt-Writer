<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" role="img" aria-labelledby="title">
  <title id="title">H3 Prompt Writer</title>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#292c33"/>
      <stop offset="1" stop-color="#17191e"/>
    </linearGradient>
    <linearGradient id="writer-blue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#72a7ff"/>
      <stop offset="1" stop-color="#70d5f4"/>
    </linearGradient>
    <filter id="panel-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity=".32"/>
    </filter>
    <filter id="bevel-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="3" stdDeviation="1.5" flood-color="#000" flood-opacity=".72"/>
      <feDropShadow dx="-1" dy="-1" stdDeviation=".8" flood-color="#fff" flood-opacity=".12"/>
    </filter>
  </defs>

  <rect x="12" y="12" width="476" height="376" rx="58" fill="url(#background)" stroke="#454a55" stroke-width="8" filter="url(#panel-shadow)"/>

  <g fill="url(#writer-blue)" filter="url(#bevel-shadow)" font-family="Segoe UI Variable Display, Segoe UI, Arial, sans-serif">
    <text x="72" y="245" textLength="356" lengthAdjust="spacingAndGlyphs" font-weight="800" font-size="270">H3</text>
    <text x="68" y="365" textLength="364" lengthAdjust="spacingAndGlyphs" fill="url(#writer-blue)" font-family="Segoe UI Variable Display, Segoe UI, Arial, sans-serif" font-weight="700" font-size="84" letter-spacing="2">WRITER</text>
  </g>
</svg>
